[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "completeclaw"
version = "0.1.0"
description = "The AI Swiss Army Knife – modular, extensible, and future-proof for all AI workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "ai", "llm", "agents", "workflows", "tools", "openai",
    "anthropic", "ollama", "local-llm", "enterprise-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core install has zero mandatory dependencies
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/GeosCrypto/CompleteClaw"
"Bug Tracker" = "https://github.com/GeosCrypto/CompleteClaw/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["completeclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
