name: Bug Report
description: Report a bug to help us improve CompleteClaw
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the sections below so contributors can understand and reproduce the issue quickly.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you trying to do, and what is the impact of this bug?
      placeholder: |
        I was attempting to... and encountered an unexpected behavior that causes...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a clear, numbered list of steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages or screenshots.
      placeholder: Instead, the application...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this bug to be considered fixed?
      placeholder: |
        - [ ] The error no longer occurs when...
        - [ ] The output matches the expected behavior described above
        - [ ] Existing tests pass and a regression test is added
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04, macOS 14]
        - Version / Commit: [e.g. v1.2.3 or abc1234]
        - Other relevant details:
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information, logs, or screenshots.
    validations:
      required: false
